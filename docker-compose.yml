# Local Postgres for the Naija Run leaderboard API (dev only).
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: naija
      POSTGRES_PASSWORD: naija
      POSTGRES_DB: naija
    ports:
      - '5432:5432'
    volumes:
      - naija_pg:/var/lib/postgresql/data
volumes:
  naija_pg: {}
